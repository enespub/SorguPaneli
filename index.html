<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorgu paneli</title>
  <meta name="description" content="sorgu paneli ni kullanmak için hemen Telegram botumuza katılın. Hızlı, güvenilir ve tamamen ücretsiz.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      background: linear-gradient(
        270deg,
        #0d1117,
        #0a2a4a,
        #2a0a4a,
        #0a3a2a,
        #0a3a3a,
        #3a0a2a,
        #0d1117
      );
      background-size: 400% 400%;
      animation: gradientMove 18s ease infinite;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      padding-bottom: 60px;
      line-height: 1.7;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      color: #58a6ff;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 1.05rem;
      color: #c9d1d9;
      margin-bottom: 16px;
      white-space: pre-line;
    }

    .btn-wrapper {
      margin-top: 32px;
      display: flex;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #1f6feb, #388bfd);
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(56, 139, 253, 0.35);
    }

    .btn:hover {
      background: linear-gradient(135deg, #388bfd, #58a6ff);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 139, 253, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      font-size: 0.7rem;
      color: #8b949e;
      text-align: center;
      padding: 12px 16px;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      border-top: 1px solid #21262d;
      z-index: 10;
    }

    .footer a {
      color: #58a6ff;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 24px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .btn {
        width: 100%;
        text-align: center;
      }
      .btn-wrapper {
        width: 100%;
      }
      .footer {
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>Türkiye'nin En İyi Sorgu Paneli</h1>

    <p>
      Merhaba! Tamamen ücretsiz sorgu panelini kullanmak için
      aşağıdaki butona basınnn..
    </p>

  </div>

  <div class="btn-wrapper">
    <a href="https://t.me/bedavasorgupanelibotu_bbot" class="btn" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
      </svg>
      Sorgu Paneline Git
    </a>
  </div>

  <div class="footer">
    © 2026 Sorgu Paneli
    <a href="https://t.me/bedavasorgupanelibotu_bbot" target="_blank" rel="noopener">Telegram</a>
  </div>

</body>
  </html>
